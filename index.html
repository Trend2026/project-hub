<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Project Hub</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#111318;color:#e8e8f0;font-family:system-ui,sans-serif}
input,select,textarea{font-family:system-ui,sans-serif}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:#1a1d27}
::-webkit-scrollbar-thumb{background:#333;border-radius:3px}
@keyframes spin{to{transform:rotate(360deg)}}
.drag-over{border:1px dashed #7F77DD !important;background:rgba(127,119,221,0.08) !important;}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
var SURL="https://gbaoymjpeuxybovfgjfj.supabase.co";
var SKEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdiYW95bWpwZXV4eWJvdmZnamZqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc0NTM3MzQsImV4cCI6MjA5MzAyOTczNH0.uR2tQnkr5c1i0V8dY5AmMo3iF8nfKYXTdW5ohW22zgo";
var HDR={"Content-Type":"application/json",apikey:SKEY,Authorization:"Bearer "+SKEY};
var AKEY="all_projects";

function dbLoad(){
  return fetch(SURL+"/rest/v1/projects?id=eq."+AKEY+"&select=*",{headers:HDR})
    .then(function(r){return r.json();})
    .then(function(rows){
      if(!rows||!rows.length)return[];
      return JSON.parse(rows[0].data);
    }).catch(function(){return[];});
}

function dbSaveAll(projects){
  return fetch(SURL+"/rest/v1/projects?id=eq."+AKEY,{method:"DELETE",headers:HDR})
    .then(function(){
      return fetch(SURL+"/rest/v1/projects",{
        method:"POST",
        headers:Object.assign({},HDR,{Prefer:"return=minimal"}),
        body:JSON.stringify({id:AKEY,data:JSON.stringify(projects),updated_at:new Date().toISOString()})
      });
    }).then(function(r){
      if(!r.ok)throw new Error("Save failed");
    });
}

var PSC={
  active:{label:"Active",bg:"#1D9E75",text:"#E1F5EE"},
  inprogress:{label:"In Progress",bg:"#378ADD",text:"#E6F1FB"},
  onhold:{label:"On Hold",bg:"#BA7517",text:"#FAEEDA"},
  complete:{label:"Complete",bg:"#639922",text:"#EAF3DE"},
  review:{label:"Review",bg:"#7F77DD",text:"#EEEDFE"}
};
var SS=["development","pending"];
var SL={development:"Development",pending:"Pending"};
var SC={development:"#fe203d",pending:"#F6B53C"};
var PC=["#7F77DD","#1D9E75","#378ADD","#D85A30","#D4537E","#BA7517","#E24B4A","#0F6E56"];

function uid(){return Math.random().toString(36).slice(2,9);}
function tod(){return new Date().toISOString().slice(0,10);}
function addD(d,n){var dt=new Date(d);dt.setDate(dt.getDate()+n);return dt.toISOString().slice(0,10);}

function PBar(props){
  var done=props.tasks.filter(function(t){return t.status==="done";}).length;
  var pct=props.tasks.length?Math.round(done/props.tasks.length*100):0;
  return(
    <div style={{marginTop:8}}>
      <div style={{display:"flex",justifyContent:"space-between",fontSize:11,color:"#888",marginBottom:3}}>
        <span>{done}/{props.tasks.length} tasks</span><span>{pct}%</span>
      </div>
      <div style={{height:4,borderRadius:2,background:"rgba(255,255,255,0.12)"}}>
        <div style={{height:4,borderRadius:2,background:props.color,width:pct+"%",transition:"width .4s"}}/>
      </div>
    </div>
  );
}

function SBadge(props){
  var c=PSC[props.status]||PSC.active;
  return <span style={{fontSize:10,fontWeight:500,padding:"2px 8px",borderRadius:99,background:c.bg,color:c.text,textTransform:"uppercase",letterSpacing:0.5}}>{c.label}</span>;
}

function App(){
  var useState=React.useState;
  var useEffect=React.useEffect;
  var useRef=React.useRef;
  var useCallback=React.useCallback;

  var r1=useState([]);var projects=r1[0];var setProjects=r1[1];
  var r2=useState(true);var loading=r2[0];var setLoading=r2[1];
  var r3=useState("idle");var sync=r3[0];var setSync=r3[1];
  var r4=useState("home");var view=r4[0];var setView=r4[1];
  var r5=useState(null);var aid=r5[0];var setAid=r5[1];
  var r6=useState(false);var addPOpen=r6[0];var setAddPOpen=r6[1];
  var r7=useState({name:"",description:"",color:PC[0],status:"active"});var np=r7[0];var setNp=r7[1];
  var r8=useState(false);var addTOpen=r8[0];var setAddTOpen=r8[1];
  var r9=useState({name:""});var nt=r9[0];var setNt=r9[1];
  var r10=useState(null);var editT=r10[0];var setEditT=r10[1];
  var r11=useState(null);var delConf=r11[0];var setDelConf=r11[1];
  var r12=useState(false);var impOpen=r12[0];var setImpOpen=r12[1];
  var r13=useState(null);var impPrev=r13[0];var setImpPrev=r13[1];
  var r14=useState("");var impErr=r14[0];var setImpErr=r14[1];
  var r15=useState(null);var activeTask=r15[0];var setActiveTask=r15[1];

  var dragItem=useRef(null);
  var dragOver=useRef(null);
  var dragSubItem=useRef(null);
  var dragSubOver=useRef(null);

  useEffect(function(){
    dbLoad().then(function(data){
      setProjects(data&&data.length?data:[]);
      setLoading(false);
    });
  },[]);

  var persist=useCallback(function(updated){
    setSync("saving");
    return dbSaveAll(updated).then(function(){
      setSync("saved");
      setTimeout(function(){setSync("idle");},2000);
    }).catch(function(e){setSync("error");console.error(e);});
  },[]);

  var proj=projects.find(function(p){return p.id===aid;});
  var overdue=projects.flatMap(function(p){return p.tasks;}).filter(function(t){return t.end&&t.end<tod();}).length;
  var thisWeek=projects.flatMap(function(p){return p.tasks;}).filter(function(t){return t.end&&t.end>=tod()&&t.end<=addD(tod(),7);}).length;
  var totalT=projects.flatMap(function(p){return p.tasks;}).length;

  function openP(id){setAid(id);setView("detail");setActiveTask(null);}
  function goHome(){setView("home");setAid(null);setAddTOpen(false);setEditT(null);setActiveTask(null);}

  // Project drag
  function onPDS(e,idx){dragItem.current=idx;e.dataTransfer.effectAllowed="move";}
  function onPDE(e,idx){dragOver.current=idx;e.currentTarget.classList.add("drag-over");}
  function onPDL(e){e.currentTarget.classList.remove("drag-over");}
  function onPDO(e){e.preventDefault();}
  function onPDrop(e){
    e.currentTarget.classList.remove("drag-over");
    var f=dragItem.current;var t=dragOver.current;
    if(f===null||t===null||f===t){dragItem.current=null;dragOver.current=null;return;}
    var u=projects.slice();var item=u.splice(f,1)[0];u.splice(t,0,item);
    dragItem.current=null;dragOver.current=null;
    setProjects(u);persist(u);
  }

  // Task drag
  function onTDS(e,idx){dragItem.current=idx;e.dataTransfer.effectAllowed="move";}
  function onTDE(e,idx){dragOver.current=idx;e.currentTarget.classList.add("drag-over");}
  function onTDL(e){e.currentTarget.classList.remove("drag-over");}
  function onTDO(e){e.preventDefault();}
  function onTDrop(e){
    e.currentTarget.classList.remove("drag-over");
    var f=dragItem.current;var t=dragOver.current;
    if(f===null||t===null||f===t){dragItem.current=null;dragOver.current=null;return;}
    var u=projects.map(function(p){
      if(p.id!==aid)return p;
      var tasks=p.tasks.slice();var item=tasks.splice(f,1)[0];tasks.splice(t,0,item);
      return Object.assign({},p,{tasks:tasks});
    });
    dragItem.current=null;dragOver.current=null;
    setProjects(u);persist(u);
  }

  // Subtask drag
  function onSDS(e,idx){e.stopPropagation();dragSubItem.current=idx;e.dataTransfer.effectAllowed="move";}
  function onSDE(e,idx){e.stopPropagation();dragSubOver.current=idx;e.currentTarget.classList.add("drag-over");}
  function onSDL(e){e.stopPropagation();e.currentTarget.classList.remove("drag-over");}
  function onSDO(e){e.stopPropagation();e.preventDefault();}
  function onSDrop(e,tid){
    e.stopPropagation();
    e.currentTarget.classList.remove("drag-over");
    var f=dragSubItem.current;var t=dragSubOver.current;
    if(f===null||t===null||f===t){dragSubItem.current=null;dragSubOver.current=null;return;}
    var u=projects.map(function(p){
      if(p.id!==aid)return p;
      return Object.assign({},p,{tasks:p.tasks.map(function(tk){
        if(tk.id!==tid)return tk;
        var subs=tk.subtasks.slice();var item=subs.splice(f,1)[0];subs.splice(t,0,item);
        return Object.assign({},tk,{subtasks:subs});
      })});
    });
    dragSubItem.current=null;dragSubOver.current=null;
    setProjects(u);persist(u);
  }

  function addProject(){
    if(!np.name.trim())return;
    var p=Object.assign({},np,{id:uid(),tasks:[]});
    var u=projects.concat([p]);
    setProjects(u);setNp({name:"",description:"",color:PC[0],status:"active"});setAddPOpen(false);
    persist(u);
  }

  function delProject(id){
    var u=projects.filter(function(p){return p.id!==id;});
    setProjects(u);setDelConf(null);persist(u);
  }

  function updProject(id,changes){
    var u=projects.map(function(p){return p.id===id?Object.assign({},p,changes):p;});
    setProjects(u);persist(u);
  }

  function addTask(){
    if(!nt.name.trim())return;
    var t=Object.assign({},nt,{id:uid(),subtasks:[]});
    var u=projects.map(function(p){return p.id===aid?Object.assign({},p,{tasks:p.tasks.concat([t])}):p;});
    setProjects(u);setNt({name:""});setAddTOpen(false);
    persist(u);
  }

  function delTask(tid){
    var u=projects.map(function(p){return p.id===aid?Object.assign({},p,{tasks:p.tasks.filter(function(t){return t.id!==tid;})}):p;});
    setProjects(u);persist(u);
  }

  function updTask(tid,changes){
    var u=projects.map(function(p){
      return p.id===aid?Object.assign({},p,{tasks:p.tasks.map(function(t){return t.id===tid?Object.assign({},t,changes):t;})}):p;
    });
    setProjects(u);persist(u);
  }

  function saveEdit(){
    if(!editT)return;
    updTask(editT.id,editT);setEditT(null);
  }

  function exportBackup(){
    var data={
      name:"Project Hub Backup",desc:"Exported "+new Date().toLocaleDateString(),
      lists:projects.map(function(p,i){return{id:p.id,name:p.name,closed:false,pos:(i+1)*65536};}),
      cards:projects.flatMap(function(p){
        return p.tasks.map(function(t,i){
          return{id:t.id,name:t.name,
            desc:t.subtasks&&t.subtasks.length?t.subtasks.map(function(s){return(s.done?"✅ ":"⬜ ")+s.name;}).join("\n"):"",
            idList:p.id,closed:false,due:null,dueComplete:false,pos:(i+1)*65536,labels:[],checklists:[]};
        });
      }),
      labels:[],members:[],exportedAt:new Date().toISOString()
    };
    var blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
    var url=URL.createObjectURL(blob);
    var a=document.createElement("a");a.href=url;
    a.download="projecthub-backup-"+tod()+".json";a.click();URL.revokeObjectURL(url);
  }

  function handleTrello(e){
    setImpErr("");var file=e.target.files[0];if(!file)return;
    file.text().then(function(text){
      var board=JSON.parse(text);
      var lists=board.lists.filter(function(l){return!l.closed;});
      var cards=board.cards.filter(function(c){return!c.closed;});
      setImpPrev(lists.map(function(l,i){
        return{id:uid(),name:l.name,description:"",color:PC[i%PC.length],status:"active",
          tasks:cards.filter(function(c){return c.idList===l.id;}).map(function(c){
            return{id:uid(),name:c.name,subtasks:[]};
          })};
      }));
    }).catch(function(){setImpErr("Invalid Trello JSON file.");});
  }

  function doImport(mode){
    if(!impPrev)return;
    var u=mode==="replace"?impPrev:projects.concat(impPrev);
    setProjects(u);persist(u);
    setImpOpen(false);setImpPrev(null);setImpErr("");
  }

  function nextT(p){return p.tasks[0];}

  var st={
    topBar:{background:"#16181f",borderBottom:"1px solid #2a2d3a",padding:"14px 24px",display:"flex",alignItems:"center",justifyContent:"space-between"},
    statCard:{background:"#1a1d27",border:"1px solid #2a2d3a",borderRadius:10,padding:"12px 18px",minWidth:110},
    card:{background:"#1a1d27",border:"1px solid #2a2d3a",borderRadius:14,padding:"18px",cursor:"grab",transition:"border-color .2s,transform .15s"},
    btn:{background:"#7F77DD",color:"#fff",border:"none",borderRadius:8,padding:"8px 16px",fontSize:13,fontWeight:500,cursor:"pointer"},
    btnSm:{background:"transparent",color:"#aaa",border:"1px solid #333",borderRadius:7,padding:"5px 12px",fontSize:12,cursor:"pointer"},
    inp:{background:"#111318",border:"1px solid #333",borderRadius:8,padding:"8px 12px",color:"#eee",fontSize:13,width:"100%",boxSizing:"border-box"},
    sel:{background:"#111318",border:"1px solid #333",borderRadius:8,padding:"8px 12px",color:"#eee",fontSize:13,width:"100%"},
    modal:{position:"fixed",inset:0,background:"rgba(0,0,0,0.7)",display:"flex",alignItems:"center",justifyContent:"center",zIndex:100},
    mbox:{background:"#1a1d27",border:"1px solid #2d3045",borderRadius:16,padding:"24px",width:400,maxWidth:"95vw"},
    lbl:{fontSize:12,color:"#888",marginBottom:4,display:"block"},
    sec:{fontSize:13,fontWeight:600,color:"#aaa",textTransform:"uppercase",letterSpacing:0.8,marginBottom:12},
    trow:{display:"flex",alignItems:"center",gap:8,padding:"9px 12px",borderRadius:9,border:"1px solid #222",cursor:"pointer",userSelect:"none"}
  };

  if(loading)return(
    <div style={{minHeight:"100vh",background:"#111318",display:"flex",alignItems:"center",justifyContent:"center",flexDirection:"column",gap:16}}>
      <div style={{width:36,height:36,border:"3px solid #2a2d3a",borderTop:"3px solid #7F77DD",borderRadius:"50%",animation:"spin 0.8s linear infinite"}}/>
      <span style={{color:"#666",fontSize:13}}>Loading your projects...</span>
    </div>
  );

  return(
    <div style={{minHeight:"100vh",background:"#111318",color:"#e8e8f0",fontFamily:"system-ui,sans-serif",paddingBottom:40}}>

      {/* TOP BAR */}
      <div style={st.topBar}>
        <div style={{display:"flex",alignItems:"center",gap:10}}>
          {view==="detail"&&<button style={Object.assign({},st.btnSm,{marginRight:4})} onClick={goHome}>Back</button>}
          {view==="home"
            ?<span style={{fontWeight:600,fontSize:17,color:"#fff"}}>Project Hub</span>
            :<input value={proj?proj.name:""} onChange={function(e){updProject(proj.id,{name:e.target.value});}}
              style={{background:"transparent",border:"none",borderBottom:"1px solid #444",color:"#fff",fontSize:17,fontWeight:600,outline:"none",padding:"2px 4px",minWidth:180}}/>
          }
          {view==="detail"&&proj&&(
            <select value={proj.status} onChange={function(e){updProject(proj.id,{status:e.target.value});}}
              style={Object.assign({},st.sel,{width:"auto",fontSize:12,padding:"4px 8px",marginLeft:8})}>
              {Object.keys(PSC).map(function(k){return <option key={k} value={k}>{PSC[k].label}</option>;})}
            </select>
          )}
          {sync!=="idle"&&<span style={{fontSize:11,marginLeft:12,color:sync==="saving"?"#BA7517":sync==="saved"?"#1D9E75":"#E24B4A"}}>
            {sync==="saving"?"⏳ Saving...":sync==="saved"?"✅ Saved":"❌ Sync error"}
          </span>}
        </div>
        <div style={{display:"flex",gap:8}}>
          {view==="home"&&<button style={st.btn} onClick={function(){setAddPOpen(true);}}>+ New Project</button>}
          {view==="home"&&<button style={st.btnSm} onClick={function(){setImpOpen(true);}}>Import Trello</button>}
          {view==="home"&&<button style={Object.assign({},st.btnSm,{borderColor:"#1D9E75",color:"#1D9E75"})} onClick={exportBackup}>Backup</button>}
          {view==="detail"&&<button style={Object.assign({},st.btn,{background:"#1D9E75"})} onClick={function(){setAddTOpen(true);}}>+ Add Task</button>}
        </div>
      </div>

      {/* HOME */}
      {view==="home"&&(
        <div>
          <div style={{display:"flex",gap:16,flexWrap:"wrap",padding:"16px 24px 0"}}>
            <div style={st.statCard}><div style={{fontSize:22,fontWeight:600,color:"#fff"}}>{projects.length}</div><div style={{fontSize:11,color:"#666",marginTop:2,textTransform:"uppercase",letterSpacing:0.5}}>Projects</div></div>
            <div style={st.statCard}><div style={{fontSize:22,fontWeight:600,color:"#fff"}}>{totalT}</div><div style={{fontSize:11,color:"#666",marginTop:2,textTransform:"uppercase",letterSpacing:0.5}}>Total Tasks</div></div>
            <div style={Object.assign({},st.statCard,{borderColor:thisWeek?"#378ADD44":"#2a2d3a"})}>
              <div style={{fontSize:22,fontWeight:600,color:thisWeek?"#378ADD":"#fff"}}>{thisWeek}</div>
              <div style={{fontSize:11,color:"#666",marginTop:2,textTransform:"uppercase",letterSpacing:0.5}}>Due This Week</div>
            </div>
            <div style={Object.assign({},st.statCard,{borderColor:overdue?"#E24B4A55":"#2a2d3a"})}>
              <div style={{fontSize:22,fontWeight:600,color:overdue?"#E24B4A":"#fff"}}>{overdue}</div>
              <div style={{fontSize:11,color:"#666",marginTop:2,textTransform:"uppercase",letterSpacing:0.5}}>Overdue</div>
            </div>
          </div>
          <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(280px,1fr))",gap:16,padding:"20px 24px 0"}}>
            {projects.map(function(p,idx){
              var nt2=nextT(p);
              return(
                <div key={p.id} draggable={true}
                  onDragStart={function(e){onPDS(e,idx);}}
                  onDragEnter={function(e){onPDE(e,idx);}}
                  onDragLeave={onPDL} onDragOver={onPDO} onDrop={onPDrop}
                  style={st.card}
                  onClick={function(){openP(p.id);}}
                  onMouseEnter={function(e){e.currentTarget.style.borderColor=p.color;e.currentTarget.style.transform="translateY(-2px)";}}
                  onMouseLeave={function(e){e.currentTarget.style.borderColor="#2a2d3a";e.currentTarget.style.transform="";}}
                >
                  <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:8}}>
                    <div style={{display:"flex",alignItems:"center",gap:8,flex:1}}>
                      <span style={{color:"#444",fontSize:12,cursor:"grab"}}>⠿</span>
                      <span style={{width:10,height:10,borderRadius:"50%",background:p.color,display:"inline-block",flexShrink:0}}/>
                      <span style={{fontWeight:600,fontSize:15,color:"#fff"}}>{p.name}</span>
                    </div>
                    <div style={{display:"flex",gap:6,alignItems:"center"}}>
                      <SBadge status={p.status}/>
                      <button style={{background:"none",border:"none",color:"#555",cursor:"pointer",fontSize:14,padding:"2px 4px"}}
                        onClick={function(e){e.stopPropagation();setDelConf(p.id);}}>x</button>
                    </div>
                  </div>
                  <div style={{fontSize:12,color:"#888",lineHeight:1.5,marginBottom:10}}>{p.description||<span style={{fontStyle:"italic",color:"#555"}}>No description</span>}</div>
                  {nt2&&(
                    <div style={{background:"rgba(255,255,255,0.04)",borderRadius:7,padding:"7px 10px",fontSize:12,color:"#bbb",borderLeft:"3px solid "+p.color}}>
                      <span style={{color:"#666",fontSize:11}}>NEXT: </span>{nt2.name}
                    </div>
                  )}
                  <PBar tasks={p.tasks} color={p.color}/>
                </div>
              );
            })}
          </div>
        </div>
      )}

      {/* DETAIL */}
      {view==="detail"&&proj&&(
        <div style={{display:"flex"}}>
          <div style={{flex:1,padding:"20px 24px",minWidth:0}}>
            <div style={{marginBottom:24}}>
              <div style={st.sec}>Tasks</div>
              {proj.tasks.length===0&&<div style={{color:"#555",fontSize:13}}>No tasks yet.</div>}
              {proj.tasks.map(function(t,idx){
                var subs=t.subtasks||[];
                var subDone=subs.filter(function(s){return s.done;}).length;
                var isOpen=activeTask===t.id;
                return(
                  <div key={t.id} draggable={true}
                    onDragStart={function(e){onTDS(e,idx);}}
                    onDragEnter={function(e){onTDE(e,idx);}}
                    onDragLeave={onTDL} onDragOver={onTDO} onDrop={onTDrop}
                    style={{marginBottom:6}}
                  >
                    {/* TASK ROW */}
                    <div style={Object.assign({},st.trow,{
                      borderColor:isOpen?"#D4537E55":"#222",
                      background:isOpen?"rgba(212,83,126,0.07)":"#111318"
                    })} onClick={function(){setActiveTask(isOpen?null:t.id);}}>
                      <span style={{color:"#444",fontSize:14,cursor:"grab",flexShrink:0}} onClick={function(e){e.stopPropagation();}}>⠿</span>
                      <span style={{flex:1,fontSize:13,fontWeight:isOpen?600:400,color:isOpen?"#D4537E":"#e0e0e0"}}>
                        {t.name}
                        {subs.length>0&&<span style={{marginLeft:8,fontSize:10,color:isOpen?"rgba(212,83,126,0.6)":"#555"}}>{subDone}/{subs.length}</span>}
                      </span>
                      <button style={{background:"none",border:"none",color:"#1D9E75",cursor:"pointer",fontSize:11,padding:"2px 6px",flexShrink:0}}
                        onClick={function(e){e.stopPropagation();updTask(t.id,{subtasks:subs.concat([{id:uid(),name:"New subtask",done:false,status:"pending"}])});setActiveTask(t.id);}}>+Sub</button>
                      <button style={{background:"none",border:"none",color:"#7F77DD",cursor:"pointer",fontSize:12,padding:"2px 6px",flexShrink:0}}
                        onClick={function(e){e.stopPropagation();setEditT(Object.assign({},t));}}>Edit</button>
                      <button style={{background:"none",border:"none",color:"#555",cursor:"pointer",fontSize:13,padding:"2px 4px",flexShrink:0}}
                        onClick={function(e){e.stopPropagation();delTask(t.id);}}>x</button>
                      <span style={{color:isOpen?"#D4537E":"#444",fontSize:10,flexShrink:0}}>{isOpen?"▲":"▼"}</span>
                    </div>

                    {/* SUBTASKS */}
                    {isOpen&&(
                      <div style={{marginLeft:24,marginTop:4}}>
                        {subs.length===0&&<div style={{fontSize:12,color:"#555",fontStyle:"italic",padding:"6px 0"}}>No subtasks yet — click +Sub to add one.</div>}
                        {subs.map(function(s,sidx){
                          return(
                            <div key={s.id} draggable={true}
                              onDragStart={function(e){onSDS(e,sidx);}}
                              onDragEnter={function(e){onSDE(e,sidx);}}
                              onDragLeave={onSDL}
                              onDragOver={onSDO}
                              onDrop={function(e){onSDrop(e,t.id);}}
                              style={{background:"rgba(255,255,255,0.02)",borderRadius:7,marginBottom:4,border:"1px solid #1a1a2a"}}
                            >
                              <div style={{display:"flex",alignItems:"flex-start",gap:8,padding:"6px 10px",flexWrap:"wrap"}}>
                                <span style={{color:"#444",fontSize:12,cursor:"grab",flexShrink:0,marginTop:2}}>⠿</span>
                                <input type="checkbox" checked={s.done||false}
                                  onChange={function(e){
                                    updTask(t.id,{subtasks:subs.map(function(x){return x.id===s.id?Object.assign({},x,{done:e.target.checked}):x;})});
                                  }}
                                  style={{cursor:"pointer",accentColor:"#1D9E75",flexShrink:0,marginTop:3}}/>
                                <textarea value={s.name}
                                  onChange={function(e){
                                    updTask(t.id,{subtasks:subs.map(function(x){return x.id===s.id?Object.assign({},x,{name:e.target.value}):x;})});
                                  }}
                                  onInput={function(e){e.target.style.height="auto";e.target.style.height=e.target.scrollHeight+"px";}}
                                  rows={1}
                                  style={{flex:"1 1 100px",minWidth:60,background:"transparent",border:"none",color:s.done?"#555":"#E8832A",fontSize:12,outline:"none",
                                    textDecoration:s.done?"line-through":"none",resize:"none",overflow:"hidden",lineHeight:1.5,padding:0}}
                                />
                                <div style={{display:"flex",alignItems:"center",gap:6,flexShrink:0}}>
                                  <select value={s.status||"pending"}
                                    onChange={function(e){
                                      updTask(t.id,{subtasks:subs.map(function(x){return x.id===s.id?Object.assign({},x,{status:e.target.value}):x;})});
                                    }}
                                    style={{background:"#111318",border:"1px solid #2a2d3a",borderRadius:6,padding:"2px 8px",fontSize:11,fontWeight:700,color:SC[s.status||"pending"],cursor:"pointer",outline:"none"}}>
                                    {SS.map(function(sv){return <option key={sv} value={sv} style={{color:SC[sv]}}>{SL[sv]}</option>;})}
                                  </select>
                                  <button style={{background:"none",border:"none",color:"#444",cursor:"pointer",fontSize:12}}
                                    onClick={function(){updTask(t.id,{subtasks:subs.filter(function(x){return x.id!==s.id;})});}}>x</button>
                                </div>
                              </div>
                            </div>
                          );
                        })}
                      </div>
                    )}
                  </div>
                );
              })}
            </div>
          </div>

          {/* SIDEBAR */}
          <div style={{width:"28%",minWidth:200,maxWidth:280,borderLeft:"1px solid #2a2d3a",background:"#13151e",padding:"20px 14px",overflowY:"auto",maxHeight:"calc(100vh - 53px)",position:"sticky",top:53}}>
            <div style={{fontSize:11,fontWeight:600,color:"#555",textTransform:"uppercase",letterSpacing:0.8,marginBottom:14}}>All Projects</div>
            {projects.map(function(p){
              var isAct=p.id===aid;
              var pDone=p.tasks.filter(function(t){return t.status==="done";}).length;
              var pPct=p.tasks.length?Math.round(pDone/p.tasks.length*100):0;
              return(
                <div key={p.id} onClick={function(){openP(p.id);}}
                  style={{padding:"10px 12px",borderRadius:9,marginBottom:8,cursor:"pointer",
                    background:isAct?"rgba(127,119,221,0.15)":"transparent",
                    border:"1px solid "+(isAct?p.color:"#222"),transition:"all .15s"}}
                  onMouseEnter={function(e){if(!isAct){e.currentTarget.style.background="rgba(255,255,255,0.04)";e.currentTarget.style.borderColor="#333";}}}
                  onMouseLeave={function(e){if(!isAct){e.currentTarget.style.background="transparent";e.currentTarget.style.borderColor="#222";}}}
                >
                  <div style={{display:"flex",alignItems:"center",gap:7,marginBottom:5}}>
                    <span style={{width:8,height:8,borderRadius:"50%",background:p.color,flexShrink:0,display:"inline-block"}}/>
                    <span style={{fontSize:12,fontWeight:isAct?600:400,color:isAct?"#D4537E":"#bbb",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{p.name}</span>
                  </div>
                  <div style={{display:"flex",alignItems:"center",gap:6}}>
                    <div style={{flex:1,height:3,borderRadius:2,background:"rgba(255,255,255,0.08)"}}>
                      <div style={{height:3,borderRadius:2,background:p.color,width:pPct+"%"}}/>
                    </div>
                    <span style={{fontSize:10,color:"#555"}}>{pPct}%</span>
                  </div>
                </div>
              );
            })}
          </div>
        </div>
      )}

      {/* ADD PROJECT */}
      {addPOpen&&(
        <div style={st.modal} onClick={function(){setAddPOpen(false);}}>
          <div style={st.mbox} onClick={function(e){e.stopPropagation();}}>
            <div style={{fontWeight:600,fontSize:16,color:"#fff",marginBottom:18}}>New Project</div>
            <div style={{marginBottom:12}}><label style={st.lbl}>Project Name</label>
              <input style={st.inp} value={np.name} onChange={function(e){setNp(function(p){return Object.assign({},p,{name:e.target.value});});}} placeholder="e.g. Website Redesign"/></div>
            <div style={{marginBottom:12}}><label style={st.lbl}>Description</label>
              <textarea style={Object.assign({},st.inp,{resize:"vertical",minHeight:60})} value={np.description} onChange={function(e){setNp(function(p){return Object.assign({},p,{description:e.target.value});});}} placeholder="Short summary..."/></div>
            <div style={{marginBottom:12,display:"flex",gap:12}}>
              <div style={{flex:1}}><label style={st.lbl}>Status</label>
                <select style={st.sel} value={np.status} onChange={function(e){setNp(function(p){return Object.assign({},p,{status:e.target.value});});}}>
                  {Object.keys(PSC).map(function(k){return <option key={k} value={k}>{PSC[k].label}</option>;})}
                </select></div>
              <div><label style={st.lbl}>Colour</label>
                <div style={{display:"flex",gap:6,flexWrap:"wrap",marginTop:4}}>
                  {PC.map(function(c){return(
                    <div key={c} onClick={function(){setNp(function(p){return Object.assign({},p,{color:c});});}}
                      style={{width:22,height:22,borderRadius:"50%",background:c,cursor:"pointer",border:np.color===c?"2px solid #fff":"2px solid transparent"}}/>
                  );})}
                </div></div>
            </div>
            <div style={{display:"flex",gap:8,justifyContent:"flex-end",marginTop:20}}>
              <button style={st.btnSm} onClick={function(){setAddPOpen(false);}}>Cancel</button>
              <button style={st.btn} onClick={addProject}>Create Project</button>
            </div>
          </div>
        </div>
      )}

      {/* ADD TASK */}
      {addTOpen&&(
        <div style={st.modal} onClick={function(){setAddTOpen(false);}}>
          <div style={st.mbox} onClick={function(e){e.stopPropagation();}}>
            <div style={{fontWeight:600,fontSize:16,color:"#fff",marginBottom:18}}>Add Task</div>
            <div style={{marginBottom:12}}><label style={st.lbl}>Task Name</label>
              <input style={st.inp} value={nt.name} onChange={function(e){setNt(function(t){return Object.assign({},t,{name:e.target.value});});}} placeholder="e.g. Write copy"/></div>
            <div style={{display:"flex",gap:8,justifyContent:"flex-end",marginTop:20}}>
              <button style={st.btnSm} onClick={function(){setAddTOpen(false);}}>Cancel</button>
              <button style={st.btn} onClick={addTask}>Add Task</button>
            </div>
          </div>
        </div>
      )}

      {/* EDIT TASK */}
      {editT&&(
        <div style={st.modal} onClick={function(){setEditT(null);}}>
          <div style={st.mbox} onClick={function(e){e.stopPropagation();}}>
            <div style={{fontWeight:600,fontSize:16,color:"#fff",marginBottom:18}}>Edit Task</div>
            <div style={{marginBottom:12}}><label style={st.lbl}>Task Name</label>
              <input style={st.inp} value={editT.name} onChange={function(e){setEditT(function(t){return Object.assign({},t,{name:e.target.value});});}}/></div>
            <div style={{display:"flex",gap:8,justifyContent:"flex-end",marginTop:20}}>
              <button style={st.btnSm} onClick={function(){setEditT(null);}}>Cancel</button>
              <button style={st.btn} onClick={saveEdit}>Save Changes</button>
            </div>
          </div>
        </div>
      )}

      {/* IMPORT */}
      {impOpen&&(
        <div style={st.modal} onClick={function(){setImpOpen(false);setImpPrev(null);setImpErr("");}}>
          <div style={Object.assign({},st.mbox,{width:500,maxHeight:"80vh",overflowY:"auto"})} onClick={function(e){e.stopPropagation();}}>
            <div style={{fontWeight:600,fontSize:16,color:"#fff",marginBottom:6}}>Import from Trello</div>
            <div style={{fontSize:12,color:"#666",marginBottom:18,lineHeight:1.6}}>In Trello: open your board, click Show Menu, More, Print and Export, Export as JSON. Then select the file below.</div>
            {!impPrev?(
              <div>
                <label style={{display:"block",background:"#111318",border:"2px dashed #333",borderRadius:10,padding:"24px",textAlign:"center",cursor:"pointer"}}>
                  <input type="file" accept=".json" style={{display:"none"}} onChange={handleTrello}/>
                  <div style={{fontSize:28,marginBottom:8}}>📂</div>
                  <div style={{fontSize:13,color:"#888"}}>Click to select your Trello JSON file</div>
                </label>
                {impErr&&<div style={{fontSize:12,color:"#E24B4A",marginTop:10}}>{impErr}</div>}
                <div style={{display:"flex",justifyContent:"flex-end",marginTop:16}}>
                  <button style={st.btnSm} onClick={function(){setImpOpen(false);setImpErr("");}}>Cancel</button>
                </div>
              </div>
            ):(
              <div>
                <div style={{fontSize:12,color:"#1D9E75",marginBottom:12,fontWeight:500}}>Found {impPrev.length} projects with {impPrev.reduce(function(a,p){return a+p.tasks.length;},0)} tasks</div>
                <div style={{maxHeight:260,overflowY:"auto",marginBottom:16}}>
                  {impPrev.map(function(p){return(
                    <div key={p.id} style={{display:"flex",alignItems:"center",gap:8,padding:"8px 10px",background:"#111318",borderRadius:8,marginBottom:6,border:"1px solid #222"}}>
                      <span style={{width:8,height:8,borderRadius:"50%",background:p.color,display:"inline-block",flexShrink:0}}/>
                      <span style={{flex:1,fontSize:13,color:"#e0e0e0",fontWeight:500}}>{p.name}</span>
                      <span style={{fontSize:11,color:"#666"}}>{p.tasks.length} tasks</span>
                    </div>
                  );})}
                </div>
                <div style={{fontSize:12,color:"#888",marginBottom:14}}>How would you like to import?</div>
                <div style={{display:"flex",gap:8,justifyContent:"flex-end",flexWrap:"wrap"}}>
                  <button style={st.btnSm} onClick={function(){setImpPrev(null);}}>Back</button>
                  <button style={Object.assign({},st.btn,{background:"#378ADD"})} onClick={function(){doImport("merge");}}>Merge with existing</button>
                  <button style={Object.assign({},st.btn,{background:"#E24B4A"})} onClick={function(){doImport("replace");}}>Replace all</button>
                </div>
              </div>
            )}
          </div>
        </div>
      )}

      {/* DELETE */}
      {delConf&&(
        <div style={st.modal} onClick={function(){setDelConf(null);}}>
          <div style={Object.assign({},st.mbox,{width:320})} onClick={function(e){e.stopPropagation();}}>
            <div style={{fontWeight:600,fontSize:15,color:"#fff",marginBottom:10}}>Delete Project?</div>
            <div style={{fontSize:13,color:"#888",marginBottom:20}}>This will permanently remove the project and all its tasks.</div>
            <div style={{display:"flex",gap:8,justifyContent:"flex-end"}}>
              <button style={st.btnSm} onClick={function(){setDelConf(null);}}>Cancel</button>
              <button style={Object.assign({},st.btn,{background:"#E24B4A"})} onClick={function(){delProject(delConf);}}>Delete</button>
            </div>
          </div>
        </div>
      )}

    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(App));
</script>
</body>
</html>
