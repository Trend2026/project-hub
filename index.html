function dbLoad(){
  return fetch(SURL+"/rest/v1/projects?id=eq."+AKEY+"&select=*",{headers:HDR})
    .then(function(r){return r.json();})
    .then(function(rows){if(!rows||!rows.length)return[];return JSON.parse(rows[0].data);})
    .catch(function(){return[];});

function dbSaveAll(projects){
  return fetch(SURL+"/rest/v1/projects",{
    method:"POST",
    headers:Object.assign({},HDR,{Prefer:"resolution=merge-duplicates,return=minimal"}),
    body:JSON.stringify({id:AKEY,data:JSON.stringify(projects),updated_at:new Date().toISOString()})
  }).then(function(r){if(!r.ok)throw new Error("Save failed");});
}

function uid(){return Math.random().toString(36).slice(2,9);}

function AutoTA(props){
  var ref=React.useRef(null);
  React.useEffect(function(){
    if(ref.current){ref.current.style.height="auto";ref.current.style.height=ref.current.scrollHeight+"px";}
  });
  return <textarea ref={ref} value={props.value} onChange={props.onChange} rows={1}
    style={Object.assign({},props.style,{overflow:"hidden",resize:"none"})}/>;
}

function PBar(props){
  var allSubs=props.tasks.flatMap(function(t){return t.subtasks||[];});
  var done=allSubs.filter(function(s){return s.done;}).length;
  var total=allSubs.length;
  var pct=total?Math.round(done/total*100):0;
  return(
    <div style={{marginTop:8}}>
      <div style={{display:"flex",justifyContent:"space-between",fontSize:11,color:"#888",marginBottom:3}}>
        <span>{total>0?done+"/"+total+" subtasks":props.tasks.length+" tasks"}</span>
        <span>{total>0?pct+"%":""}</span>
      </div>
      <div style={{height:4,borderRadius:2,background:"rgba(255,255,255,0.12)"}}>
        <div style={{height:4,borderRadius:2,background:props.color,width:pct+"%",transition:"width .4s"}}/>
      </div>
    </div>
  );
}

function SBadge(props){

// ── GANTT VIEW ──────────────────────────────────────────────
function GanttView(props){
  var projects=props.projects;
  var goHome=props.goHome;

  var rows=[];
  projects.forEach(function(p){
    p.tasks.forEach(function(t){
      (t.subtasks||[]).forEach(function(s){
        if(s.date) rows.push({project:p,task:t,sub:s,date:s.date});
      });
    });
  });
  rows.sort(function(a,b){return a.date<b.date?-1:a.date>b.date?1:0;});

  if(rows.length===0){
    return(
      <div style={{minHeight:"100vh",background:"#111318",paddingBottom:40}}>
        <div style={{background:"#16181f",borderBottom:"1px solid #2a2d3a",padding:"14px 24px",display:"flex",alignItems:"center",gap:12}}>
          <button onClick={goHome} style={{background:"transparent",color:"#aaa",border:"1px solid #333",borderRadius:7,padding:"5px 12px",fontSize:12,cursor:"pointer"}}>Back</button>
          <button onClick={goHome} style={{background:"transparent",color:"#7F77DD",border:"1px solid #7F77DD",borderRadius:7,padding:"5px 12px",fontSize:12,cursor:"pointer"}}>Dashboard</button>
          <span style={{fontWeight:600,fontSize:17,color:"#fff"}}>Timeline</span>
        </div>
        <div style={{display:"flex",alignItems:"center",justifyContent:"center",flexDirection:"column",gap:12,marginTop:80}}>
          <div style={{fontSize:32}}>📅</div>
          <div style={{fontSize:15,color:"#555"}}>No subtasks with dates yet.</div>
          <div style={{fontSize:13,color:"#444"}}>Add dates to subtasks inside your projects to see them here.</div>
        </div>
      </div>
    );
  }

  var todayStr=tod();
  var todayD=new Date(todayStr);

  // Build day range — pad 2 days each side
  var allDates=rows.map(function(r){return new Date(r.date);});
  var minD=new Date(Math.min.apply(null,allDates));
  var maxD=new Date(Math.max.apply(null,allDates));
  minD.setDate(minD.getDate()-2);
  maxD.setDate(maxD.getDate()+2);

  // Build array of all days in range
  var days=[];
  var cur=new Date(minD);
  while(cur<=maxD){
    days.push(new Date(cur));
    cur.setDate(cur.getDate()+1);
  }
  var totalDays=days.length;

  var LABEL_W=220;
  var COL_W=44; // px per day
  var ROW_H=40;
  var HEADER_H=56;

  var dayNames=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
  var monthNames=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];

  function dayIndex(dateStr){
    var d=new Date(dateStr);
    return Math.round((d-minD)/86400000);
  }

  // Group months for top header
  var monthGroups=[];
  days.forEach(function(d,i){
    var key=d.getFullYear()+"-"+d.getMonth();
    if(!monthGroups.length||monthGroups[monthGroups.length-1].key!==key){
      monthGroups.push({key:key,label:monthNames[d.getMonth()]+" "+d.getFullYear(),startIdx:i,count:0});
    }
    monthGroups[monthGroups.length-1].count++;
  });

  var chartW=totalDays*COL_W;

  return(
    <div style={{minHeight:"100vh",background:"#111318",paddingBottom:40}}>
      {/* Top bar */}
      <div style={{background:"#16181f",borderBottom:"1px solid #2a2d3a",padding:"14px 24px",display:"flex",alignItems:"center",gap:12}}>
        <button onClick={goHome} style={{background:"transparent",color:"#aaa",border:"1px solid #333",borderRadius:7,padding:"5px 12px",fontSize:12,cursor:"pointer"}}>Back</button>
        <button onClick={goHome} style={{background:"transparent",color:"#7F77DD",border:"1px solid #7F77DD",borderRadius:7,padding:"5px 12px",fontSize:12,cursor:"pointer"}}>Dashboard</button>
        <span style={{fontWeight:600,fontSize:17,color:"#fff"}}>Timeline</span>
        <span style={{fontSize:12,color:"#555",marginLeft:4}}>{rows.length} scheduled subtasks</span>
      </div>

      {/* Legend */}
      <div style={{display:"flex",gap:20,flexWrap:"wrap",padding:"12px 24px",borderBottom:"1px solid #1a1d27",alignItems:"center"}}>
        {projects.filter(function(p){return p.tasks.some(function(t){return(t.subtasks||[]).some(function(s){return s.date;});});}).map(function(p){
          return <div key={p.id} style={{display:"flex",alignItems:"center",gap:6,fontSize:12,color:"#aaa"}}>
            <span style={{width:10,height:10,borderRadius:"50%",background:p.color,display:"inline-block"}}/>{p.name}
          </div>;
        })}
        <div style={{marginLeft:"auto",display:"flex",gap:14,fontSize:11,color:"#555"}}>
          <span style={{display:"flex",alignItems:"center",gap:5}}><span style={{width:12,height:12,background:"rgba(230,50,50,0.18)",display:"inline-block",borderRadius:2}}/>Past</span>
          <span style={{display:"flex",alignItems:"center",gap:5}}><span style={{width:2,height:12,background:"#E24B4A",display:"inline-block"}}/>Today</span>
          <span style={{display:"flex",alignItems:"center",gap:5}}><span style={{width:14,height:14,background:"#639922",borderRadius:2,display:"inline-block",transform:"rotate(45deg)"}}/>Done</span>
          <span style={{display:"flex",alignItems:"center",gap:5}}><span style={{width:14,height:14,background:"#E24B4A",borderRadius:2,display:"inline-block",transform:"rotate(45deg)"}}/>Overdue</span>
        </div>
      </div>

      {/* Scrollable chart area */}
      <div style={{overflowX:"auto",padding:"0 24px 24px"}}>
        <div style={{display:"flex",minWidth:LABEL_W+chartW}}>

          {/* Row labels */}
          <div style={{width:LABEL_W,minWidth:LABEL_W,flexShrink:0}}>
            {/* Header spacer */}
            <div style={{height:HEADER_H}}/>
            {projects.map(function(p){
              var pRows=rows.filter(function(r){return r.project.id===p.id;});
              if(!pRows.length)return null;
              return(
                <div key={p.id}>
                  {/* Project group header */}
                  <div style={{height:28,display:"flex",alignItems:"center",paddingRight:12,borderBottom:"1px solid #1a1d27"}}>
                    <span style={{width:7,height:7,borderRadius:"50%",background:p.color,display:"inline-block",marginRight:6,flexShrink:0}}/>
                    <span style={{fontSize:11,fontWeight:700,color:p.color,textTransform:"uppercase",letterSpacing:0.5,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{p.name}</span>
                  </div>
                  {pRows.map(function(r){
                    return(
                      <div key={r.sub.id} style={{height:ROW_H,display:"flex",flexDirection:"column",justifyContent:"center",paddingRight:12,borderBottom:"1px solid #1a1a2a"}}>
                        <div style={{fontSize:10,color:"#555",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{r.task.name}</div>
                        <div style={{fontSize:12,color:r.sub.done?"#444":(SC[r.sub.status||"pending"]||"#aaa"),
                          overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap",
                          textDecoration:r.sub.done?"line-through":"none",fontWeight:500}}>{r.sub.name}</div>
                      </div>
                    );
                  })}
                </div>
              );
            })}
          </div>

          {/* Grid + bars */}
          <div style={{flex:1,position:"relative",overflowX:"visible"}}>
            {/* Month header row */}
            <div style={{display:"flex",height:22,borderBottom:"1px solid #2a2d3a",background:"#13151e"}}>
              {monthGroups.map(function(mg,i){
                return(
                  <div key={i} style={{width:mg.count*COL_W,flexShrink:0,borderRight:"1px solid #2a2d3a",
                    display:"flex",alignItems:"center",paddingLeft:6,fontSize:11,fontWeight:600,color:"#7F77DD",overflow:"hidden"}}>
                    {mg.label}
                  </div>
                );
              })}
            </div>

            {/* Day header row */}
            <div style={{display:"flex",height:HEADER_H-22,borderBottom:"1px solid #2a2d3a",background:"#13151e"}}>
              {days.map(function(d,i){
                var dStr=d.toISOString().slice(0,10);
                var isPast=dStr<todayStr;
                var isToday=dStr===todayStr;
                var isWeekend=d.getDay()===0||d.getDay()===6;
                return(
                  <div key={i} style={{width:COL_W,minWidth:COL_W,flexShrink:0,
                    borderRight:"1px solid #1a1d27",
                    background:isToday?"rgba(230,75,74,0.2)":isPast?"rgba(230,50,50,0.06)":isWeekend?"rgba(255,255,255,0.02)":"transparent",
                    display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",gap:1}}>
                    <span style={{fontSize:9,color:isToday?"#E24B4A":isPast?"#E24B4A66":isWeekend?"#555":"#444",fontWeight:isToday?700:400}}>{dayNames[d.getDay()]}</span>
                    <span style={{fontSize:11,fontWeight:isToday?700:400,color:isToday?"#E24B4A":isPast?"#E24B4A88":"#666"}}>{d.getDate()}</span>
                  </div>
                );
              })}
            </div>

            {/* Row content */}
            {projects.map(function(p){
              var pRows=rows.filter(function(r){return r.project.id===p.id;});
              if(!pRows.length)return null;
              return(
                <div key={p.id}>
                  {/* Project group header row */}
                  <div style={{display:"flex",height:28,borderBottom:"1px solid #1a1d27",background:"rgba(255,255,255,0.01)"}}>
                    {days.map(function(d,i){
                      var dStr=d.toISOString().slice(0,10);
                      var isPast=dStr<todayStr;
                      var isToday=dStr===todayStr;
                      return <div key={i} style={{width:COL_W,minWidth:COL_W,flexShrink:0,
                        borderRight:"1px solid #1a1a2a",
                        background:isToday?"rgba(230,75,74,0.15)":isPast?"rgba(230,50,50,0.07)":"transparent"}}/>;
                    })}
                  </div>

                  {pRows.map(function(r){
                    var dIdx=dayIndex(r.date);
                    var isOD=r.date<todayStr&&!r.sub.done;
                    var diamondColor=r.sub.done?"#639922":isOD?"#E24B4A":p.color;
                    return(
                      <div key={r.sub.id} style={{display:"flex",height:ROW_H,position:"relative",borderBottom:"1px solid #1a1a2a"}}>
                        {/* Day columns */}
                        {days.map(function(d,i){
                          var dStr=d.toISOString().slice(0,10);
                          var isPast=dStr<todayStr;
                          var isToday=dStr===todayStr;
                          var isTarget=dStr===r.date;
                          return(
                            <div key={i} style={{width:COL_W,minWidth:COL_W,flexShrink:0,height:"100%",
                              borderRight:"1px solid #1a1a2a",
                              background:isToday?"rgba(230,75,74,0.15)":isPast?"rgba(230,50,50,0.07)":"transparent",
                              position:"relative",display:"flex",alignItems:"center",justifyContent:"center"}}>
                              {isTarget&&(
                                <div style={{width:16,height:16,background:diamondColor,transform:"rotate(45deg)",borderRadius:2,
                                  boxShadow:"0 0 6px "+diamondColor+"88",zIndex:2}}/>
                              )}
                            </div>
                          );
                        })}
                        {/* Date label floating after diamond */}
                        {(function(){
                          var left=(dIdx+1)*COL_W;
                          return(
                            <div style={{position:"absolute",left:left,top:"50%",transform:"translateY(-50%)",
                              fontSize:10,color:isOD?"#E24B4A":r.sub.done?"#444":"#777",
                              whiteSpace:"nowrap",pointerEvents:"none",fontWeight:isOD?600:400,zIndex:3}}>
                              {isOD?" OVERDUE":r.sub.done?" ✓":""}
                            </div>
                          );
                        })()}
                      </div>
                    );
                  })}
                </div>
              );
            })}
          </div>
        </div>
      </div>
    </div>
  );
}

// ── MAIN APP ─────────────────────────────────────────────────
function App(){
  var useState=React.useState,useEffect=React.useEffect,useRef=React.useRef,useCallback=React.useCallback;

  var r1=useState([]);    var projects=r1[0];   var setProjects=r1[1];
  var r2=useState(true);  var loading=r2[0];    var setLoading=r2[1];
  var r3=useState("idle");var sync=r3[0];       var setSync=r3[1];
  var r4=useState("home");var view=r4[0];       var setView=r4[1];
  var r5=useState(null);  var aid=r5[0];        var setAid=r5[1];
  var r6=useState(false); var addPOpen=r6[0];   var setAddPOpen=r6[1];
  var r7=useState({name:"",description:"",targetDate:"",color:"#7F77DD",status:"active"});var np=r7[0];var setNp=r7[1];
  var r8=useState(false); var addTOpen=r8[0];   var setAddTOpen=r8[1];
  var r9=useState({name:""});var nt=r9[0];      var setNt=r9[1];
  var r10=useState(null); var editT=r10[0];     var setEditT=r10[1];
  var r11=useState(null); var delConf=r11[0];   var setDelConf=r11[1];
  var r12=useState(false);var impOpen=r12[0];   var setImpOpen=r12[1];
  var r13=useState(null); var impPrev=r13[0];   var setImpPrev=r13[1];
  var r14=useState("");   var impErr=r14[0];    var setImpErr=r14[1];
  var r15=useState(null); var activeTask=r15[0];var setActiveTask=r15[1];
  var r16=useState(false);var showBkup=r16[0];  var setShowBkup=r16[1];
  var r17=useState(null); var editColorId=r17[0];var setEditColorId=r17[1];
  var r18=useState(function(){return lsGet(COLOR_KEY,DEFAULT_COLORS);});var palette=r18[0];var setPalette=r18[1];
  var r19=useState("#7F77DD");var newColor=r19[0];var setNewColor=r19[1];
  var r20=useState("");   var search=r20[0];    var setSearch=r20[1];
  var r21=useState(false);var searchFocused=r21[0];var setSearchFocused=r21[1];

  var dragP=useRef(null);var dragPO=useRef(null);
  var dragT=useRef(null);var dragTO=useRef(null);
  var dragS=useRef(null);var dragSO=useRef(null);

  useEffect(function(){
    dbLoad().then(function(data){setProjects(data&&data.length?data:[]);setLoading(false);});
  },[]);

  useEffect(function(){
    function check(){
      var last=localStorage.getItem(BACKUP_TS_KEY);
      if(!last||(Date.now()-parseInt(last))>THREE_HOURS)setShowBkup(true);
    }
    check();var iv=setInterval(check,THREE_HOURS);return function(){clearInterval(iv);};
  },[]);

  var persist=useCallback(function(updated){
    setSync("saving");
    dbSaveAll(updated)
      .then(function(){setSync("saved");setTimeout(function(){setSync("idle");},2000);})
      .catch(function(e){setSync("error");console.error(e);});
  },[]);

  function savePalette(p){setPalette(p);lsSet(COLOR_KEY,p);}
  function addColor(){if(!palette.includes(newColor))savePalette(palette.concat([newColor]));}
  function removeColor(c){savePalette(palette.filter(function(x){return x!==c;}));}

  var proj=projects.find(function(p){return p.id===aid;});
  var totalT=projects.flatMap(function(p){return p.tasks;}).length;

  var searchResults=search.trim().length>1?(function(){
    var q=search.trim().toLowerCase();
    var out=[];
    projects.forEach(function(p){
      var m=[];
      if(p.name.toLowerCase().indexOf(q)>-1)m.push({type:"project",text:p.name});
      p.tasks.forEach(function(t){
        if(t.name.toLowerCase().indexOf(q)>-1)m.push({type:"task",text:t.name});
        (t.subtasks||[]).forEach(function(s){
          if(s.name.toLowerCase().indexOf(q)>-1)m.push({type:"subtask",text:s.name});
        });
      });
      if(m.length)out.push({project:p,matches:m});
    });
    return out;
  })():[];

  function openP(id){setAid(id);setView("detail");setActiveTask(null);}
  function goHome(){setView("home");setAid(null);setActiveTask(null);}
  function openGantt(){setView("gantt");}

  function pdStart(e,i){dragP.current=i;e.dataTransfer.effectAllowed="move";}
  function pdEnter(e,i){dragPO.current=i;e.currentTarget.classList.add("drag-over");}
  function pdLeave(e){e.currentTarget.classList.remove("drag-over");}
  function pdOver(e){e.preventDefault();}
  function pdDrop(e){
    e.currentTarget.classList.remove("drag-over");
    var f=dragP.current,t=dragPO.current;dragP.current=null;dragPO.current=null;
    if(f===null||t===null||f===t)return;
    var u=projects.slice();u.splice(t,0,u.splice(f,1)[0]);
    setProjects(u);persist(u);
  }
  function tdStart(e,i){dragT.current=i;e.dataTransfer.effectAllowed="move";}
  function tdEnter(e,i){dragTO.current=i;e.currentTarget.classList.add("drag-over");}
  function tdLeave(e){e.currentTarget.classList.remove("drag-over");}
  function tdOver(e){e.preventDefault();}
  function tdDrop(e){
    e.currentTarget.classList.remove("drag-over");
    var f=dragT.current,t=dragTO.current;dragT.current=null;dragTO.current=null;
    if(f===null||t===null||f===t)return;
    var u=projects.map(function(p){
      if(p.id!==aid)return p;
      var tasks=p.tasks.slice();tasks.splice(t,0,tasks.splice(f,1)[0]);
      return Object.assign({},p,{tasks:tasks});
    });
    setProjects(u);persist(u);
  }
  function sdStart(e,i){e.stopPropagation();dragS.current=i;e.dataTransfer.effectAllowed="move";}
  function sdEnter(e,i){e.stopPropagation();dragSO.current=i;e.currentTarget.classList.add("drag-over");}
  function sdLeave(e){e.stopPropagation();e.currentTarget.classList.remove("drag-over");}
  function sdOver(e){e.stopPropagation();e.preventDefault();}
  function sdDrop(e,tid){
    e.stopPropagation();e.currentTarget.classList.remove("drag-over");
    var f=dragS.current,t=dragSO.current;dragS.current=null;dragSO.current=null;
    if(f===null||t===null||f===t)return;
    var u=projects.map(function(p){
      if(p.id!==aid)return p;
      return Object.assign({},p,{tasks:p.tasks.map(function(tk){
        if(tk.id!==tid)return tk;
        var subs=tk.subtasks.slice();subs.splice(t,0,subs.splice(f,1)[0]);
        return Object.assign({},tk,{subtasks:subs});
      })});
    });
    setProjects(u);persist(u);
  }

  function addProject(){
    if(!np.name.trim())return;
    var p=Object.assign({},np,{id:uid(),tasks:[]});
    var u=projects.concat([p]);
    setProjects(u);setNp({name:"",description:"",targetDate:"",color:palette[0]||"#7F77DD",status:"active"});setAddPOpen(false);persist(u);
  }
  function delProject(id){
    var u=projects.filter(function(p){return p.id!==id;});
    setProjects(u);setDelConf(null);persist(u);
  }
  function updProject(id,changes){
    var u=projects.map(function(p){return p.id===id?Object.assign({},p,changes):p;});
    setProjects(u);persist(u);
  }
  function addTask(){
    if(!nt.name.trim())return;
    var t=Object.assign({},nt,{id:uid(),subtasks:[]});
    var u=projects.map(function(p){return p.id===aid?Object.assign({},p,{tasks:p.tasks.concat([t])}):p;});
    setProjects(u);setNt({name:""});setAddTOpen(false);persist(u);
  }
  function delTask(tid){
    var u=projects.map(function(p){return p.id===aid?Object.assign({},p,{tasks:p.tasks.filter(function(t){return t.id!==tid;})}):p;});
    setProjects(u);persist(u);
  }
  function updTask(tid,changes){
    var u=projects.map(function(p){
      return p.id===aid?Object.assign({},p,{tasks:p.tasks.map(function(t){return t.id===tid?Object.assign({},t,changes):t;})}):p;
    });
    setProjects(u);persist(u);
  }
  function updSub(tid,sid,changes){
    var u=projects.map(function(p){
      return p.id===aid?Object.assign({},p,{tasks:p.tasks.map(function(t){
        return t.id===tid?Object.assign({},t,{subtasks:t.subtasks.map(function(s){
          return s.id===sid?Object.assign({},s,changes):s;
        })}):t;
      })}):p;
    });
    setProjects(u);persist(u);
  }
  function delSub(tid,sid){
    var u=projects.map(function(p){
      return p.id===aid?Object.assign({},p,{tasks:p.tasks.map(function(t){
        return t.id===tid?Object.assign({},t,{subtasks:t.subtasks.filter(function(s){return s.id!==sid;})}):t;
      })}):p;
    });
    setProjects(u);persist(u);
  }
  function saveEdit(){if(!editT)return;updTask(editT.id,editT);setEditT(null);}

  function exportBackup(){
    var data={name:"Project Hub Backup",desc:"Exported "+new Date().toLocaleDateString(),
      lists:projects.map(function(p,i){return{id:p.id,name:p.name,closed:false,pos:(i+1)*65536};}),
      cards:projects.flatMap(function(p){
        return p.tasks.map(function(t,i){
          return{id:t.id,name:t.name,
            desc:t.subtasks&&t.subtasks.length?t.subtasks.map(function(s){return(s.done?"✅ ":"⬜ ")+s.name;}).join("\n"):"",
            idList:p.id,closed:false,due:null,dueComplete:false,pos:(i+1)*65536,labels:[],checklists:[]};
        });
      }),labels:[],members:[],exportedAt:new Date().toISOString()};
    var blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
    var url=URL.createObjectURL(blob);
    var a=document.createElement("a");a.href=url;a.download="projecthub-backup-"+tod()+".json";a.click();URL.revokeObjectURL(url);
  }
  function doBackup(){lsSet(BACKUP_TS_KEY,Date.now());setShowBkup(false);exportBackup();}

  function handleTrello(e){
    setImpErr("");var file=e.target.files[0];if(!file)return;
    file.text().then(function(text){
      var board=JSON.parse(text);
      var lists=board.lists.filter(function(l){return!l.closed;});
      var cards=board.cards.filter(function(c){return!c.closed;});
      setImpPrev(lists.map(function(l,i){
        return{id:uid(),name:l.name,description:"",targetDate:"",color:palette[i%palette.length]||"#7F77DD",status:"active",
          tasks:cards.filter(function(c){return c.idList===l.id;}).map(function(c){return{id:uid(),name:c.name,subtasks:[]};})};
      }));
    }).catch(function(){setImpErr("Invalid Trello JSON file.");});
  }
  function doImport(mode){
    if(!impPrev)return;
    var u=mode==="replace"?impPrev:projects.concat(impPrev);
    setProjects(u);persist(u);setImpOpen(false);setImpPrev(null);setImpErr("");
  }

  // Count subtasks with dates for the Gantt card
  var datedSubCount=projects.flatMap(function(p){
    return p.tasks.flatMap(function(t){return(t.subtasks||[]).filter(function(s){return s.date;});});
  }).length;

  var st={
    topBar:{background:"#16181f",borderBottom:"1px solid #2a2d3a",padding:"14px 24px",display:"flex",alignItems:"center",justifyContent:"space-between"},
    sCard:{background:"#1a1d27",border:"1px solid #2a2d3a",borderRadius:10,padding:"12px 18px",minWidth:110},
    pCard:{background:"#1a1d27",border:"1px solid #2a2d3a",borderRadius:14,padding:"18px",cursor:"grab",transition:"border-color .2s,transform .15s"},
    btn:{background:"#7F77DD",color:"#fff",border:"none",borderRadius:8,padding:"8px 16px",fontSize:13,fontWeight:500,cursor:"pointer"},
    btnSm:{background:"transparent",color:"#aaa",border:"1px solid #333",borderRadius:7,padding:"5px 12px",fontSize:12,cursor:"pointer"},
    inp:{background:"#111318",border:"1px solid #333",borderRadius:8,padding:"8px 12px",color:"#eee",fontSize:13,width:"100%",boxSizing:"border-box"},
    sel:{background:"#111318",border:"1px solid #333",borderRadius:8,padding:"8px 12px",color:"#eee",fontSize:13,width:"100%"},
    modal:{position:"fixed",inset:0,background:"rgba(0,0,0,0.7)",display:"flex",alignItems:"center",justifyContent:"center",zIndex:100},
    mbox:{background:"#1a1d27",border:"1px solid #2d3045",borderRadius:16,padding:"24px",width:400,maxWidth:"95vw"},
    lbl:{fontSize:12,color:"#888",marginBottom:4,display:"block"},
    sec:{fontSize:13,fontWeight:600,color:"#aaa",textTransform:"uppercase",letterSpacing:0.8,marginBottom:12},
    trow:{display:"flex",alignItems:"center",gap:8,padding:"9px 12px",borderRadius:9,border:"1px solid #222",cursor:"pointer",userSelect:"none"}
  };

  if(loading)return(

      <div style={{width:36,height:36,border:"3px solid #2a2d3a",borderTop:"3px solid #7F77DD",borderRadius:"50%",animation:"spin 0.8s linear infinite"}}/>
      <span style={{color:"#666",fontSize:13}}>Loading your projects...</span>
    </div>

  // Render Gantt view

  return(
    <div style={{minHeight:"100vh",background:"#111318",color:"#e8e8f0",fontFamily:"system-ui,sans-serif",paddingBottom:40}}>

          {view==="detail"&&<button style={Object.assign({},st.btnSm,{marginRight:4})} onClick={goHome}>Back</button>}
          {view==="detail"&&<button style={Object.assign({},st.btnSm,{marginRight:4,borderColor:"#7F77DD",color:"#7F77DD"})} onClick={goHome}>Dashboard</button>}
          {view==="home"
            ?<span style={{fontWeight:600,fontSize:17,color:"#fff"}}>Project Hub</span>
            :<input value={proj?proj.name:""} onChange={function(e){updProject(proj.id,{name:e.target.value});}}
              style={{background:"transparent",border:"none",borderBottom:"1px solid #444",color:"#fff",fontSize:17,fontWeight:600,outline:"none",padding:"2px 4px",minWidth:180}}/>
          }
          {view==="detail"&&proj&&(
            <div style={{display:"flex",alignItems:"center",gap:8,marginLeft:4}}>
              <span title="Change colour"
                style={{width:12,height:12,borderRadius:"50%",background:proj.color,display:"inline-block",flexShrink:0,cursor:"pointer",border:"2px solid transparent",transition:"border .15s"}}
                onClick={function(){setEditColorId(proj.id);}}
                onMouseEnter={function(e){e.currentTarget.style.border="2px solid #fff";}}
                onMouseLeave={function(e){e.currentTarget.style.border="2px solid transparent";}}
              />
              <select value={proj.status} onChange={function(e){updProject(proj.id,{status:e.target.value});}}
                style={Object.assign({},st.sel,{width:"auto",fontSize:12,padding:"4px 8px"})}>
                {Object.keys(PSC).map(function(k){return <option key={k} value={k}>{PSC[k].label}</option>;})}
              </select>
            </div>
          )}

            </span>

        </div>
        <div style={{display:"flex",gap:8}}>

          {view==="home"&&<button style={st.btnSm} onClick={function(){setImpOpen(true);}}>Import Trello</button>}
          {view==="home"&&<button style={Object.assign({},st.btnSm,{borderColor:"#1D9E75",color:"#1D9E75"})} onClick={doBackup}>Backup</button>}
          {view==="detail"&&<button style={Object.assign({},st.btn,{background:"#1D9E75"})} onClick={function(){setAddTOpen(true);}}>+ Add Task</button>}

      </div>

      {/* HOME */}
      {view==="home"&&(

          <div style={{display:"flex",gap:16,flexWrap:"wrap",padding:"16px 24px 0"}}>
            <div style={st.sCard}><div style={{fontSize:22,fontWeight:600,color:"#fff"}}>{projects.length}</div><div style={{fontSize:11,color:"#666",marginTop:2,textTransform:"uppercase",letterSpacing:0.5}}>Projects</div></div>
            <div style={st.sCard}><div style={{fontSize:22,fontWeight:600,color:"#fff"}}>{totalT}</div><div style={{fontSize:11,color:"#666",marginTop:2,textTransform:"uppercase",letterSpacing:0.5}}>Total Tasks</div></div>
          </div>

          {/* SEARCH */}

              <input value={search}

                placeholder="Search projects, tasks, subtasks..."

                  borderRadius:10,padding:"10px 36px",color:"#eee",fontSize:13,outline:"none",transition:"border .2s"}}
              />
              {search&&<button onClick={function(){setSearch("");}}

                        style={{display:"flex",alignItems:"center",gap:8,padding:"10px 14px",cursor:"pointer",background:"rgba(255,255,255,0.03)"}}
                        onMouseEnter={function(e){e.currentTarget.style.background="rgba(127,119,221,0.12)";}}
                        onMouseLeave={function(e){e.currentTarget.style.background="rgba(255,255,255,0.03)";}}>
                        <span style={{width:8,height:8,borderRadius:"50%",background:r.project.color,display:"inline-block",flexShrink:0}}/>
                        <span style={{fontWeight:600,fontSize:13,color:"#fff",flex:1}}>{r.project.name}</span>
                        <span style={{fontSize:11,color:"#555"}}>{r.matches.length} match{r.matches.length!==1?"es":""}</span>
                      </div>
                      {r.matches.slice(0,4).map(function(m,i){
                        return(
                          <div key={i} onClick={function(){openP(r.project.id);setSearch("");}}
                            style={{display:"flex",alignItems:"flex-start",gap:10,padding:"6px 14px 6px 30px",cursor:"pointer"}}
                            onMouseEnter={function(e){e.currentTarget.style.background="rgba(255,255,255,0.04)";}}
                            onMouseLeave={function(e){e.currentTarget.style.background="transparent";}}>

                  onMouseLeave={function(e){e.currentTarget.style.borderColor=isOverdue?"#E24B4A55":"#2a2d3a";e.currentTarget.style.transform="";}}
                >
                  <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:8}}>

                  <PBar tasks={p.tasks} color={p.color}/>
                </div>
              );

            {/* GANTT CARD */}
            <div

              onMouseEnter={function(e){e.currentTarget.style.borderColor="#7F77DD";e.currentTarget.style.transform="translateY(-2px)";}}
              onMouseLeave={function(e){e.currentTarget.style.borderColor="#2a2d3a";e.currentTarget.style.transform="";}}
            >

              <div style={{fontWeight:600,fontSize:15,color:"#7F77DD"}}>Timeline</div>
              <div style={{fontSize:12,color:"#555",textAlign:"center",lineHeight:1.5}}>
                Gantt view of all<br/>scheduled subtasks
              </div>
              {datedSubCount>0&&(
                <div style={{fontSize:11,color:"#7F77DD",background:"rgba(127,119,221,0.1)",

                  {datedSubCount} scheduled

            </div>
          </div>
        </div>

      {/* DETAIL */}
      {view==="detail"&&proj&&(
        <div style={{display:"flex"}}>
          <div style={{flex:1,padding:"20px 24px",minWidth:0}}>
            <div style={st.sec}>Tasks</div>
            {proj.tasks.length===0&&<div style={{color:"#555",fontSize:13}}>No tasks yet.</div>}
            {proj.tasks.map(function(t,idx){

                    onClick={function(){setActiveTask(isOpen?null:t.id);}}>
                    <span style={{color:"#444",fontSize:14,cursor:"grab",flexShrink:0}} onClick={function(e){e.stopPropagation();}}>⠿</span>
                    <span style={{flex:1,fontSize:13,fontWeight:isOpen?600:400,color:isOpen?"#D4537E":"#e0e0e0"}}>

                      {subs.length>0&&<span style={{marginLeft:8,fontSize:10,color:isOpen?"rgba(212,83,126,0.6)":"#555"}}>{subDone}/{subs.length}</span>}

                      onClick={function(e){e.stopPropagation();updTask(t.id,{subtasks:subs.concat([{id:uid(),name:"New subtask",done:false,status:"pending",date:""}])});setActiveTask(t.id);}}>+Sub</button>

                    <span style={{color:isOpen?"#D4537E":"#444",fontSize:10,flexShrink:0}}>{isOpen?"▲":"▼"}</span>
                  </div>
                  {isOpen&&(
                    <div style={{marginLeft:24,marginTop:4}}>
                      {subs.length===0&&<div style={{fontSize:12,color:"#555",fontStyle:"italic",padding:"6px 0"}}>No subtasks yet — click +Sub to add one.</div>}
                      {subs.map(function(s,sidx){

                        return(
                          <div key={s.id} draggable={true}
                            onDragStart={function(e){sdStart(e,sidx);}}
                            onDragEnter={function(e){sdEnter(e,sidx);}}
                            onDragLeave={sdLeave} onDragOver={sdOver}
                            onDrop={function(e){sdDrop(e,t.id);}}
                            style={{background:"rgba(255,255,255,0.02)",borderRadius:7,marginBottom:4,
                              border:"1px solid "+(subOverdue?"#E24B4A44":"#1a1a2a"),padding:"6px 10px"}}
                          >
                            <div style={{display:"flex",alignItems:"flex-start",gap:8}}>
                              <span style={{color:"#444",fontSize:12,cursor:"grab",flexShrink:0,paddingTop:2}}>⠿</span>
                              <input type="checkbox" checked={s.done||false}
                                onChange={function(e){updSub(t.id,s.id,{done:e.target.checked});}}
                                style={{cursor:"pointer",accentColor:"#1D9E75",flexShrink:0,marginTop:3}}/>
                              <AutoTA value={s.name}
                                onChange={function(e){updSub(t.id,s.id,{name:e.target.value});}}
                                style={{flex:1,background:"transparent",border:"none",color:stColor,fontSize:12,outline:"none",textDecoration:s.done?"line-through":"none",lineHeight:1.5,padding:0}}
                              />
                              <div style={{display:"flex",alignItems:"flex-start",gap:6,flexShrink:0,paddingTop:1}}>
                                <input type="date" value={s.date||""}
                                  onChange={function(e){updSub(t.id,s.id,{date:e.target.value});}}
                                  style={{background:"#111318",border:"1px solid "+(subOverdue?"#E24B4A":"#2a2d3a"),borderRadius:6,
                                    padding:"2px 6px",fontSize:11,color:subOverdue?"#E24B4A":"#888",outline:"none",colorScheme:"dark",cursor:"pointer"}}
                                />
                                <select value={s.status||"pending"}
                                  onChange={function(e){updSub(t.id,s.id,{status:e.target.value});}}
                                  style={{background:"#111318",border:"1px solid #2a2d3a",borderRadius:6,padding:"2px 8px",fontSize:11,fontWeight:700,color:SC[s.status||"pending"],cursor:"pointer",outline:"none"}}>
                                  {SS.map(function(sv){return <option key={sv} value={sv} style={{color:SC[sv]}}>{SL[sv]}</option>;})}
                                </select>
                                <button style={{background:"none",border:"none",color:"#444",cursor:"pointer",fontSize:12,paddingTop:1}}
                                  onClick={function(){delSub(t.id,s.id);}}>x</button>
                              </div>
                            </div>
                          </div>
                        );
                      })}
                    </div>
                  )}
                </div>
              );
            })}
          </div>

          {/* SIDEBAR */}
          <div style={{width:"30%",minWidth:200,borderLeft:"1px solid #2a2d3a",background:"#13151e",padding:"20px 14px",overflowY:"auto",maxHeight:"calc(100vh - 53px)",position:"sticky",top:53}}>
            <div style={{fontSize:11,fontWeight:600,color:"#555",textTransform:"uppercase",letterSpacing:0.8,marginBottom:14}}>All Projects</div>
            {projects.map(function(p){
              var isAct=p.id===aid;
              var allSubs=p.tasks.flatMap(function(t){return t.subtasks||[];});
              var pDone=allSubs.filter(function(s){return s.done;}).length;
              var pPct=allSubs.length?Math.round(pDone/allSubs.length*100):0;
              return(
                <div key={p.id} onClick={function(){openP(p.id);}}
                  style={{padding:"10px 12px",borderRadius:9,marginBottom:8,cursor:"pointer",
                    background:isAct?"rgba(127,119,221,0.15)":"transparent",
                    border:"1px solid "+(isAct?p.color:"#222"),transition:"all .15s"}}
                  onMouseEnter={function(e){if(!isAct){e.currentTarget.style.background="rgba(255,255,255,0.04)";e.currentTarget.style.borderColor="#333";}}}
                  onMouseLeave={function(e){if(!isAct){e.currentTarget.style.background="transparent";e.currentTarget.style.borderColor="#222";}}}
                >
                  <div style={{display:"flex",alignItems:"center",gap:7,marginBottom:5}}>
                    <span style={{width:8,height:8,borderRadius:"50%",background:p.color,flexShrink:0,display:"inline-block"}}/>
                    <span style={{fontSize:12,fontWeight:isAct?600:400,color:isAct?"#D4537E":"#bbb",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{p.name}</span>
                  </div>
                  <div style={{display:"flex",alignItems:"center",gap:6}}>
                    <div style={{flex:1,height:3,borderRadius:2,background:"rgba(255,255,255,0.08)"}}>
                      <div style={{height:3,borderRadius:2,background:p.color,width:pPct+"%"}}/>
                    </div>
                    <span style={{fontSize:10,color:"#555"}}>{pPct}%</span>
                  </div>
                </div>
              );
            })}
          </div>
        </div>
      )}

      {/* ADD PROJECT */}
      {addPOpen&&(
        <div style={st.modal} onClick={function(){setAddPOpen(false);}}>
          <div style={st.mbox} onClick={function(e){e.stopPropagation();}}>
            <div style={{fontWeight:600,fontSize:16,color:"#fff",marginBottom:18}}>New Project</div>
            <div style={{marginBottom:12}}><label style={st.lbl}>Project Name</label>
              <input style={st.inp} value={np.name} onChange={function(e){setNp(function(p){return Object.assign({},p,{name:e.target.value});});}} placeholder="e.g. Website Redesign"/></div>
            <div style={{marginBottom:12}}><label style={st.lbl}>Target Goal</label>
              <textarea style={Object.assign({},st.inp,{resize:"vertical",minHeight:60})} value={np.description}
                onChange={function(e){setNp(function(p){return Object.assign({},p,{description:e.target.value});});}} placeholder="What is the goal for this project?"/></div>
            <div style={{marginBottom:12}}><label style={st.lbl}>Target Date</label>
              <input type="date" style={Object.assign({},st.inp,{colorScheme:"dark"})} value={np.targetDate}
                onChange={function(e){setNp(function(p){return Object.assign({},p,{targetDate:e.target.value});});}}/></div>
            <div style={{marginBottom:12,display:"flex",gap:12}}>
              <div style={{flex:1}}><label style={st.lbl}>Status</label>
                <select style={st.sel} value={np.status} onChange={function(e){setNp(function(p){return Object.assign({},p,{status:e.target.value});});}}>
                  {Object.keys(PSC).map(function(k){return <option key={k} value={k}>{PSC[k].label}</option>;})}
                </select></div>
              <div><label style={st.lbl}>Colour</label>
                <div style={{display:"flex",gap:6,flexWrap:"wrap",marginTop:4}}>
                  {palette.map(function(c){return(
                    <div key={c} onClick={function(){setNp(function(p){return Object.assign({},p,{color:c});});}}
                      style={{width:22,height:22,borderRadius:"50%",background:c,cursor:"pointer",
                        border:np.color===c?"2px solid #7F77DD":"2px solid rgba(255,255,255,0.1)"}}/>
                  );})}
                </div></div>
            </div>
            <div style={{display:"flex",gap:8,justifyContent:"flex-end",marginTop:20}}>
              <button style={st.btnSm} onClick={function(){setAddPOpen(false);}}>Cancel</button>
              <button style={st.btn} onClick={addProject}>Create Project</button>
            </div>
          </div>
        </div>
      )}

      {/* ADD TASK */}
      {addTOpen&&(
        <div style={st.modal} onClick={function(){setAddTOpen(false);}}>
          <div style={st.mbox} onClick={function(e){e.stopPropagation();}}>
            <div style={{fontWeight:600,fontSize:16,color:"#fff",marginBottom:18}}>Add Task</div>
            <div style={{marginBottom:12}}><label style={st.lbl}>Task Name</label>
              <input style={st.inp} value={nt.name} onChange={function(e){setNt(function(t){return Object.assign({},t,{name:e.target.value});});}} placeholder="e.g. Write copy"/></div>
            <div style={{display:"flex",gap:8,justifyContent:"flex-end",marginTop:20}}>
              <button style={st.btnSm} onClick={function(){setAddTOpen(false);}}>Cancel</button>
              <button style={st.btn} onClick={addTask}>Add Task</button>
            </div>
          </div>
        </div>
      )}

      {/* EDIT TASK */}
      {editT&&(
        <div style={st.modal} onClick={function(){setEditT(null);}}>
          <div style={st.mbox} onClick={function(e){e.stopPropagation();}}>
            <div style={{fontWeight:600,fontSize:16,color:"#fff",marginBottom:18}}>Edit Task</div>
            <div style={{marginBottom:12}}><label style={st.lbl}>Task Name</label>
              <input style={st.inp} value={editT.name} onChange={function(e){setEditT(function(t){return Object.assign({},t,{name:e.target.value});});}}/></div>
            <div style={{display:"flex",gap:8,justifyContent:"flex-end",marginTop:20}}>
              <button style={st.btnSm} onClick={function(){setEditT(null);}}>Cancel</button>
              <button style={st.btn} onClick={saveEdit}>Save Changes</button>
            </div>
          </div>
        </div>
      )}

      {/* IMPORT */}
      {impOpen&&(
        <div style={st.modal} onClick={function(){setImpOpen(false);setImpPrev(null);setImpErr("");}}>
          <div style={Object.assign({},st.mbox,{width:500,maxHeight:"80vh",overflowY:"auto"})} onClick={function(e){e.stopPropagation();}}>
            <div style={{fontWeight:600,fontSize:16,color:"#fff",marginBottom:6}}>Import from Trello</div>
            <div style={{fontSize:12,color:"#666",marginBottom:18,lineHeight:1.6}}>In Trello: open your board → Show Menu → More → Print and Export → Export as JSON. Then select the file below.</div>
            {!impPrev?(
              <div>
                <label style={{display:"block",background:"#111318",border:"2px dashed #333",borderRadius:10,padding:"24px",textAlign:"center",cursor:"pointer"}}>
                  <input type="file" accept=".json" style={{display:"none"}} onChange={handleTrello}/>
                  <div style={{fontSize:28,marginBottom:8}}>📂</div>
                  <div style={{fontSize:13,color:"#888"}}>Click to select your Trello JSON file</div>
                </label>
                {impErr&&<div style={{fontSize:12,color:"#E24B4A",marginTop:10}}>{impErr}</div>}
                <div style={{display:"flex",justifyContent:"flex-end",marginTop:16}}>
                  <button style={st.btnSm} onClick={function(){setImpOpen(false);setImpErr("");}}>Cancel</button>
                </div>
              </div>
            ):(
              <div>
                <div style={{fontSize:12,color:"#1D9E75",marginBottom:12,fontWeight:500}}>Found {impPrev.length} projects with {impPrev.reduce(function(a,p){return a+p.tasks.length;},0)} tasks</div>
                <div style={{maxHeight:260,overflowY:"auto",marginBottom:16}}>
                  {impPrev.map(function(p){return(
                    <div key={p.id} style={{display:"flex",alignItems:"center",gap:8,padding:"8px 10px",background:"#111318",borderRadius:8,marginBottom:6,border:"1px solid #222"}}>
                      <span style={{width:8,height:8,borderRadius:"50%",background:p.color,display:"inline-block",flexShrink:0}}/>
                      <span style={{flex:1,fontSize:13,color:"#e0e0e0",fontWeight:500}}>{p.name}</span>
                      <span style={{fontSize:11,color:"#666"}}>{p.tasks.length} tasks</span>
                    </div>
                  );})}
                </div>
                <div style={{fontSize:12,color:"#888",marginBottom:14}}>How would you like to import?</div>
                <div style={{display:"flex",gap:8,justifyContent:"flex-end",flexWrap:"wrap"}}>
                  <button style={st.btnSm} onClick={function(){setImpPrev(null);}}>Back</button>
                  <button style={Object.assign({},st.btn,{background:"#378ADD"})} onClick={function(){doImport("merge");}}>Merge with existing</button>
                  <button style={Object.assign({},st.btn,{background:"#E24B4A"})} onClick={function(){doImport("replace");}}>Replace all</button>
                </div>
              </div>
            )}
          </div>
        </div>
      )}

      {/* COLOUR PICKER */}
      {editColorId&&(
        <div style={st.modal} onClick={function(){setEditColorId(null);}}>
          <div style={Object.assign({},st.mbox,{width:360})} onClick={function(e){e.stopPropagation();}}>
            <div style={{fontWeight:600,fontSize:15,color:"#fff",marginBottom:16}}>Change Project Colour</div>
            <div style={{display:"flex",gap:10,flexWrap:"wrap",marginBottom:16}}>
              {palette.map(function(c){
                var projObj=projects.find(function(p){return p.id===editColorId;});
                var isCurrent=projObj?projObj.color===c:false;
                return(
                  <div key={c} style={{position:"relative"}}>
                    <div onClick={function(){updProject(editColorId,{color:c});setEditColorId(null);}}
                      style={{width:36,height:36,borderRadius:"50%",background:c,cursor:"pointer",
                        border:isCurrent?"3px solid #7F77DD":"3px solid rgba(255,255,255,0.15)",transition:"transform .15s"}}
                      onMouseEnter={function(e){e.currentTarget.style.transform="scale(1.15)";}}
                      onMouseLeave={function(e){e.currentTarget.style.transform="scale(1)";}}>
                    </div>
                    <button onClick={function(e){e.stopPropagation();removeColor(c);}}
                      style={{position:"absolute",top:-4,right:-4,width:16,height:16,borderRadius:"50%",
                        background:"#E24B4A",border:"none",color:"#fff",fontSize:9,cursor:"pointer",
                        display:"flex",alignItems:"center",justifyContent:"center",padding:0,lineHeight:1}}>x</button>
                  </div>
                );
              })}
            </div>
            <div style={{borderTop:"1px solid #2a2d3a",paddingTop:14,marginBottom:14}}>
              <div style={{fontSize:12,color:"#888",marginBottom:8}}>Add a custom colour</div>
              <div style={{display:"flex",gap:8,alignItems:"center"}}>
                <input type="color" value={newColor} onChange={function(e){setNewColor(e.target.value);}}
                  style={{width:44,height:36,border:"1px solid #333",borderRadius:8,cursor:"pointer",background:"none",padding:2}}/>
                <span style={{fontSize:13,color:"#aaa",flex:1}}>{newColor.toUpperCase()}</span>
                <button style={Object.assign({},st.btn,{padding:"6px 14px",fontSize:12})} onClick={addColor}>+ Add</button>
              </div>
            </div>
            <div style={{display:"flex",justifyContent:"flex-end"}}>
              <button style={st.btnSm} onClick={function(){setEditColorId(null);}}>Close</button>
            </div>
          </div>
        </div>
      )}

      {/* BACKUP REMINDER */}
      {showBkup&&(
        <div style={st.modal}>
          <div style={Object.assign({},st.mbox,{width:340,textAlign:"center"})}>
            <div style={{fontSize:32,marginBottom:12}}>💾</div>
            <div style={{fontWeight:600,fontSize:16,color:"#fff",marginBottom:8}}>Time to Back Up!</div>
            <div style={{fontSize:13,color:"#888",marginBottom:20,lineHeight:1.6}}>It's been over 3 hours since your last backup. Download a copy now to keep your data safe.</div>
            <div style={{display:"flex",gap:8,justifyContent:"center"}}>
              <button style={Object.assign({},st.btnSm,{borderColor:"#555",color:"#555"})} onClick={function(){setShowBkup(false);}}>Remind me later</button>
              <button style={Object.assign({},st.btn,{background:"#1D9E75"})} onClick={doBackup}>⬇ Backup Now</button>
            </div>
          </div>
        </div>
      )}

      {/* DELETE */}
      {delConf&&(
        <div style={st.modal} onClick={function(){setDelConf(null);}}>
          <div style={Object.assign({},st.mbox,{width:320})} onClick={function(e){e.stopPropagation();}}>
            <div style={{fontWeight:600,fontSize:15,color:"#fff",marginBottom:10}}>Delete Project?</div>
            <div style={{fontSize:13,color:"#888",marginBottom:20}}>This will permanently remove the project and all its tasks.</div>
            <div style={{display:"flex",gap:8,justifyContent:"flex-end"}}>
              <button style={st.btnSm} onClick={function(){setDelConf(null);}}>Cancel</button>
              <button style={Object.assign({},st.btn,{background:"#E24B4A"})} onClick={function(){delProject(delConf);}}>Delete</button>
            </div>
          </div>
        </div>
      )}

    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(App));
</script>
</body>
</html>
